<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Color Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0620;--bg2:#1d0c45;--dim:#b9a8ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:#fff;font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;background:radial-gradient(ellipse at 50% 0%,var(--bg2),var(--bg) 70%);background-color:var(--bg);overflow-x:hidden}
body:before{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;background:radial-gradient(circle at 20% 30%,rgba(255,61,242,.16),transparent 35%),radial-gradient(circle at 80% 70%,rgba(0,229,255,.14),transparent 38%);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,3%) scale(1.1)}}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.5;animation:tw 3s infinite alternate}
@keyframes tw{to{opacity:.05;transform:scale(.5)}}
main{position:relative;z-index:1;max-width:1020px;margin:0 auto;padding:10px 14px 24px}
header{text-align:center}
h1{margin:4px 0 0;font-size:clamp(26px,5.5vw,42px);font-weight:700;text-shadow:0 0 8px #ff3df2,0 0 22px #ff3df2,0 0 44px #7a1cff}
.hint{margin:2px 0 0;color:var(--dim);font-size:clamp(15px,3.4vw,19px);min-height:26px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px;align-items:start}
.pill{font-family:inherit;font-size:14px;font-weight:600;color:#fff;background:rgba(255,255,255,.08);border:2px solid rgba(125,249,255,.6);border-radius:999px;padding:6px 14px;cursor:pointer;box-shadow:0 0 12px rgba(125,249,255,.3)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.left{text-align:center}
.stage{position:relative;height:330px;margin:0 auto;max-width:380px}
.inner{position:absolute;left:50%;top:0;width:360px;height:330px;margin-left:-180px;transform-origin:top center;transform:scale(var(--k,1));perspective:700px}
.inner.pulse{animation:pl .7s}
@keyframes pl{40%{transform:scale(calc(var(--k,1)*1.06))}}
.badge{position:absolute;left:0;right:0;top:0;display:flex;gap:18px;justify-content:center;align-items:center;transition:opacity .3s}
.badge.dim{opacity:.2}
.slot{width:64px;height:64px;border-radius:50%;border:3px dashed rgba(255,255,255,.4);background:var(--c,transparent);box-shadow:0 0 16px var(--c,transparent)}
.slot.on{border-style:solid;border-color:rgba(255,255,255,.7)}
.plus{font-size:38px;color:var(--dim)}
.bowl{position:absolute;left:50%;top:0;width:290px;height:290px;margin-left:-145px;transform:rotateX(62deg)}
.rim{position:absolute;inset:0;border-radius:50%;border:9px solid #d7c8ff;background:#1b0f40;box-shadow:0 0 26px #a67bff,inset 0 0 30px #000,0 22px 0 -2px #4a2a9a,0 40px 40px rgba(0,0,0,.6)}
.liquid{position:absolute;inset:16px;border-radius:50%;background:#2a1a5e;overflow:hidden;box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
.liquid i{position:absolute;inset:-50%;border-radius:50%;transition:background .4s}
.liquid.spin i{animation:sw 1.1s linear infinite}
@keyframes sw{to{transform:rotate(360deg)}}
.liquid.done{box-shadow:inset 0 0 40px rgba(0,0,0,.3),0 0 40px var(--r),0 0 90px var(--r)}
.spoon{position:absolute;left:50%;top:0;width:16px;height:150px;margin-left:-8px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:3}
.spoon:before{content:"";position:absolute;left:0;top:0;width:16px;height:110px;border-radius:8px;background:linear-gradient(90deg,#ff9be8,#ffe27a);box-shadow:0 0 14px #ff9be8}
.spoon:after{content:"";position:absolute;left:-14px;top:88px;width:44px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffcf5a 60%,#ff8a3d);box-shadow:0 0 18px #ffcf5a}
.spoon:before{left:2px;width:12px;height:100px;border-radius:7px 7px 3px 3px;background:linear-gradient(90deg,#ff9be8,#7a1cff);box-shadow:0 0 14px #ff3df2}
.spoon:after{left:-4px;top:100px;width:24px;height:52px;border-radius:45% 45% 50% 50%/25% 25% 75% 75%;background:var(--bc,#fff);box-shadow:0 0 18px var(--bc,#fff)}
.fer{position:absolute;left:-1px;top:84px;width:18px;height:22px;border-radius:3px;background:linear-gradient(90deg,#9fb3c8,#fff,#9fb3c8);z-index:1;box-shadow:0 0 8px #fff}
.bub{position:absolute;border-radius:50%;pointer-events:none;z-index:4}
.result{position:absolute;left:0;right:0;bottom:2px;font-size:30px;font-weight:700;color:var(--r,#fff);text-shadow:0 0 10px var(--r),0 0 30px var(--r);opacity:0;transform:scale(.4);filter:brightness(1.3)}
.result.show{animation:rv .7s cubic-bezier(.2,1.7,.4,1) forwards}
@keyframes rv{to{opacity:1;transform:scale(1)}}
#mix{margin:0;font-family:inherit;font-size:26px;font-weight:700;color:#fff;border:0;border-radius:999px;padding:12px 44px;cursor:pointer;background:linear-gradient(135deg,#ff3df2,#7a1cff);box-shadow:0 0 22px #ff3df2,0 0 50px rgba(122,28,255,.7)}
#mix:not(:disabled){animation:beat 1.2s infinite}
@keyframes beat{50%{transform:scale(1.06)}}
#mix:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.panel{padding:12px 14px;border-radius:22px;border:2px solid rgba(125,249,255,.45);background:rgba(255,255,255,.04);box-shadow:0 0 22px rgba(125,249,255,.18);margin-bottom:12px}
.panel.cart{border-color:rgba(255,61,242,.55);box-shadow:0 0 22px rgba(255,61,242,.22)}
.panel h2{margin:0 0 8px;font-size:19px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel h2 small{font-size:14px;color:var(--dim);font-weight:400}
.row{display:flex;justify-content:center;gap:10px}
.item{display:flex;flex-direction:column;align-items:center;width:86px}
.orb{width:64px;height:64px;border-radius:50%;border:0;padding:0;cursor:pointer;background:var(--c);box-shadow:0 0 16px var(--c),0 0 38px var(--c);transition:transform .2s}
.orb:hover{transform:scale(1.12) translateY(-3px)}
.orb.sel{transform:scale(.86);box-shadow:0 0 34px var(--c),0 0 70px var(--c),inset 0 0 0 4px rgba(0,0,0,.25)}
.orb.born{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0) rotate(-180deg)}}
.lock{width:64px;height:64px;border-radius:50%;border:3px dashed rgba(255,255,255,.3);display:grid;place-items:center;font-size:26px;color:rgba(255,255,255,.4)}
.nm{margin-top:6px;font-weight:600;font-size:14px;color:var(--c,#8a7bd0);text-shadow:0 0 8px var(--c);filter:brightness(1.35)}
#chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:46px;max-height:190px;overflow-y:auto;padding:4px}
.chip{width:44px;height:44px;border-radius:50%;border:0;padding:0;cursor:pointer;background:var(--c);box-shadow:0 0 12px var(--c);transition:transform .2s}
.chip:hover{transform:scale(1.15)}
.chip.sel{transform:scale(.85);box-shadow:0 0 26px var(--c),inset 0 0 0 3px rgba(0,0,0,.25)}
.citem{display:flex;flex-direction:column;align-items:center;width:66px}.citem .nm{font-size:12px;margin-top:4px;text-align:center}
.top{display:flex;justify-content:flex-end;gap:10px;margin-bottom:2px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
#auto{font-size:18px;padding:12px 22px}
#auto.on{background:#00e5ff;color:#06121f;box-shadow:0 0 22px #00e5ff}
.empty{color:var(--dim);font-size:15px;align-self:center}
.reset{display:block;margin:0 auto}
.conf{position:fixed;width:10px;height:14px;z-index:9;pointer-events:none;border-radius:3px}
#win{position:fixed;inset:0;z-index:10;display:none;place-items:center;background:rgba(8,3,24,.8);text-align:center;padding:20px}
#win.on{display:grid}
#win div{font-size:clamp(28px,7vw,52px);font-weight:700;text-shadow:0 0 12px #ffe81a,0 0 36px #ff3df2;animation:rv .8s cubic-bezier(.2,1.7,.4,1) both}
#win p{font-size:18px;color:var(--dim);margin:10px 0 18px;font-weight:400;text-shadow:none;animation:none}
@media (max-width:760px){
 .grid{grid-template-columns:1fr;gap:8px}
 .stage{height:265px;max-width:300px}
 .inner{--k:.78}
 .orb,.lock{width:54px;height:54px}.item{width:76px}
 .panel{padding:8px 12px;margin-bottom:8px}.panel h2{font-size:17px;margin-bottom:4px}
 #mix{font-size:24px;padding:10px 40px}
 #chips{max-height:110px}
}
@media (prefers-reduced-motion:reduce){.star,body:before,.liquid.spin i,#mix{animation:none!important}.orb{transition:none}}
</style>
</head>

 <header>

    </div>
   </div>
   <div class="btns"><button id="mix" disabled>Mix! ✨</button><button class="pill" id="auto">🎲 Auto Mix</button></div>
  </section>
  <section class="right">
   <div class="panel"><h2>Primary colors</h2><div class="row" id="prim"></div></div>
   <div class="panel"><h2>Secondary colors <small id="prog">0 of 3 found</small></h2><div class="row" id="sec"></div></div>
   <div class="panel cart"><h2>🛒 My Color Cart <small id="cnt">tap to mix again</small></h2><div id="chips"></div></div>
     </section>
 </div>
</main>
<div id="win"><section><div id="winT">🌈 You found all 3 secondary colors!</div><p id="winP">Orange, Green and Purple. Keep mixing to make even more colors.</p><button class="pill" id="wok">Keep playing</button></section></div>
