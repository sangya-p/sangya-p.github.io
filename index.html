<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ff">
  <meta name="description" content="A growing collection of little games, puzzles, and playful experiments.">
  <title>Pixel Playground — Little games. Big fun.</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #25213b;
      --muted: #716c88;
      --purple: #7257e8;
      --line: #e9e5f5;
      --paper: #fff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: ui-rounded, "Trebuchet MS", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 7% 10%, #ffe7b8 0 6rem, transparent 6.1rem),
        radial-gradient(circle at 96% 23%, #e3dcff 0 7rem, transparent 7.1rem),
        linear-gradient(145deg, #fffaf1, #f6f3ff 56%, #effaff);
    }
    a { color: inherit; }
    .shell { width: min(1240px, calc(100% - 40px)); margin: 0 auto; padding: 26px 0 22px; }
    .topline { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
    .brand-icon {
      display: grid; flex: 0 0 auto; place-items: center; width: 62px; height: 62px;
      border: 3px solid #302752; border-radius: 20px; color: white;
      background: linear-gradient(145deg, #a38dff 0%, #7054e8 58%, #5036c5 100%);
      box-shadow: 0 5px 0 #463596, 0 10px 20px #7257e833;
    }
    .brand-icon svg { width: 43px; height: 43px; }
    .brand-name { font-size: clamp(1.8rem, 4vw, 2.65rem); font-weight: 950; line-height: 1; letter-spacing: -.055em; }
    .search-wrap { position: relative; width: min(100%, 330px); margin: 2px 0 28px auto; }
    .search-wrap svg { position: absolute; top: 50%; left: 13px; width: 18px; height: 18px; color: #89839e; transform: translateY(-50%); pointer-events: none; }
    .search {
      width: 100%; height: 42px; padding: 0 14px 0 40px; border: 1px solid #ded9ee;
      border-radius: 13px; outline: none; color: var(--ink); background: #ffffffd9;
      font: inherit; font-size: .92rem; box-shadow: 0 2px 8px #30275208;
    }
    .search::placeholder { color: #89839e; }
    .search:focus { border-color: var(--purple); box-shadow: 0 0 0 3px #7257e822; }
    .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 11px; }
    .game-card {
      --accent: #7257e8; --wash: #f0ecff;
      position: relative; display: flex; min-width: 0; min-height: 128px; flex-direction: column;
      padding: 13px 14px 12px; overflow: hidden; text-decoration: none;
      border: 1px solid var(--line); border-radius: 17px; background: var(--paper);
      box-shadow: 0 3px 0 #3027520a;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }
    .game-card:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--accent) 38%, white); box-shadow: 0 8px 17px #30275217; }
    .game-card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .game-card::after { position: absolute; top: -24px; right: -22px; width: 66px; height: 66px; border-radius: 50%; content: ""; background: var(--wash); }
    .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: auto; }
    .icon { position: relative; z-index: 1; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; color: var(--accent); background: var(--wash); font-size: 1.32rem; }
    .arrow { position: relative; z-index: 1; display: grid; place-items: center; width: 25px; height: 25px; border-radius: 50%; color: var(--accent); background: var(--wash); }
    .arrow svg { width: 14px; height: 14px; }
    .card-title { margin: 11px 0 0; font-size: .94rem; line-height: 1.2; font-weight: 850; letter-spacing: -.018em; }
    .coral { --accent: #ed715b; --wash: #fff0eb; }
    .blue { --accent: #2784c7; --wash: #e8f6ff; }
    .green { --accent: #258c68; --wash: #e7f8ef; }
    .pink { --accent: #cf4c98; --wash: #fff0f8; }
    .gold { --accent: #bd7b13; --wash: #fff6df; }
    .empty { display: none; margin: 25px 0; color: var(--muted); text-align: center; }
    footer { margin-top: 28px; color: var(--muted); font-size: .82rem; text-align: center; }
    footer span { color: #ed715b; }
    @media (min-width: 1200px) { .games { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
    @media (max-width: 650px) {
      .shell { width: min(100% - 28px, 560px); padding-top: 18px; }
      .topline { gap: 12px; margin-bottom: 24px; }
      .brand-icon { width: 52px; height: 52px; border-radius: 16px; }
      .brand-icon svg { width: 36px; height: 36px; }
      .games { grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 9px; }
      .game-card { min-height: 118px; padding: 11px 12px; }
      .search-wrap { margin-bottom: 24px; }
    }
    @media (max-width: 350px) {
      .games { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .card-title { font-size: .88rem; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topline" aria-label="Pixel Playground home">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <path d="M24 4.5 29.3 17l13.2 1.1-10 8.8 3 13-11.5-7-11.5 7 3-13-10-8.8L18.7 17 24 4.5Z" fill="#fff3a6" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M24 12v16m-8-8h16" stroke="#7054e8" stroke-width="3.2" stroke-linecap="round"/>
          <circle cx="24" cy="20" r="4.2" fill="#fff"/>
        </svg>
      </div>
      <div class="brand-name">Pixel Playground</div>
    </header>

    <section aria-label="Games">
      <label class="search-wrap">
        <span class="sr-only" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Search games</span>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="2"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input class="search" id="game-search" type="search" autocomplete="off" aria-label="Search games">
      </label>
        <br> <br> <br> <br> 
      <div class="games" id="games">
        <a class="game-card" href="color_lab.html" target="_blank" rel="noopener noreferrer" aria-label="Open Color Lab in a new tab" data-search="color lab mix match color">
          <div class="card-top"><div class="icon" aria-hidden="true">🎨</div><span class="arrow" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><path d="M4 10h11m-5-5 5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div><h3 class="card-title">Color Lab</h3>
        </a>
        <a class="game-card coral" href="find_difference.html" target="_blank" rel="noopener noreferrer" aria-label="Open Spot the Difference in a new tab" data-search="spot the difference picture puzzle">
          <div class="card-top"><div class="icon" aria-hidden="true">🔎</div><span class="arrow" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><path d="M4 10h11m-5-5 5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div><h3 class="card-title">Spot the Difference!</h3>
        </a>
        <a class="game-card blue" href="find_difference_2.html" target="_blank" rel="noopener noreferrer" aria-label="Open Find the Differences in a new tab" data-search="find the differences picture puzzle">
          <div class="card-top"><div class="icon" aria-hidden="true">🧩</div><span class="arrow" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><path d="M4 10h11m-5-5 5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div><h3 class="card-title">Find the Differences</h3>
        </a>
        <a class="game-card gold" href="magic_lamp_wish.html" target="_blank" rel="noopener noreferrer" aria-label="Open Magic Lamp Wishes in a new tab" data-search="magic lamp wishes">
          <div class="card-top"><div class="icon" aria-hidden="true">🪔</div><span class="arrow" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><path d="M4 10h11m-5-5 5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div><h3 class="card-title">Magic Lamp Wishes</h3>
        </a>
        <a class="game-card green" href="radar-game.html" target="_blank" rel="noopener noreferrer" aria-label="Open Radar Explorer in a new tab" data-search="radar explorer tracking targets">
          <div class="card-top"><div class="icon" aria-hidden="true">📡</div><span class="arrow" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><path d="M4 10h11m-5-5 5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div><h3 class="card-title">Radar Explorer</h3>
        </a>
        <a class="game-card" href="sliding.html" target="_blank" rel="noopener noreferrer" aria-label="Open Color Slide Puzzle in a new tab" data-search="color slide puzzle tiles">
          <div class="card-top"><div class="icon" aria-hidden="true">🟪</div><span class="arrow" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><path d="M4 10h11m-5-5 5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div><h3 class="card-title">Color Slide Puzzle</h3>
        </a>
        <a class="game-card pink" href="star_catcher_game.html" target="_blank" rel="noopener noreferrer" aria-label="Open Star Catcher in a new tab" data-search="star catcher stars">
          <div class="card-top"><div class="icon" aria-hidden="true">⭐</div><span class="arrow" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none"><path d="M4 10h11m-5-5 5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div><h3 class="card-title">Star Catcher!</h3>
        </a>
      </div>
      <p class="empty" id="empty-state">No games match that search.</p>
    </section>

    <footer>Made with <span aria-label="love">♥</span> and a little bit of magic</footer>
  </main>
  <script>
    const search = document.getElementById('game-search');
    const cards = [...document.querySelectorAll('.game-card')];
    const empty = document.getElementById('empty-state');

    search.addEventListener('input', () => {
      const query = search.value.trim().toLowerCase();
      let visible = 0;
      cards.forEach(card => {
        const matches = `${card.dataset.search} ${card.querySelector('.card-title').textContent}`.toLowerCase().includes(query);
        card.hidden = !matches;
        if (matches) visible += 1;
      });
      empty.style.display = visible ? 'none' : 'block';
    });
  </script>
</body>
</html>
